name: Audit snapshot (read-only)
on:
  push:
    branches: [gptpro/audit-snapshot-698c7ef]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 6bca1e12970722a724bead95b93e50eecfef0549
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Record public source and revision
        shell: bash
        run: |
          mkdir -p /tmp/audit-result
          git rev-parse HEAD > /tmp/audit-result/revision.txt
          python --version > /tmp/audit-result/python.txt
          git archive --format=zip HEAD > /tmp/audit-result/public-source.zip
      - name: Run complete offline unit suite
        shell: bash
        run: |
          set -o pipefail
          python -X utf8 -m unittest discover -s araclar -p 'test_*.py' 2>&1 | tee /tmp/audit-result/tests.log
      - name: Preserve audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audit-main-latest
          path: /tmp/audit-result/
          retention-days: 7
          if-no-files-found: error
